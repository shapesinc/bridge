name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        node: [18, 22]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Verify commands survive a real systemd user-service restart
        run: |
          sudo systemctl start "user@$(id -u).service"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          SHAPES_TEST_SYSTEMD=1 node --test test/systemd-commands.test.js
      - run: npm pack --dry-run

  windows-runtime:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [18, 22]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Compile Windows process owner
        shell: pwsh
        run: |
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          $output = Join-Path $env:RUNNER_TEMP 'shapes.inc Bridge Job.exe'
          $source = Join-Path $PWD 'scripts\windows\JobHost.cs'
          & $compiler /nologo /optimize+ /target:winexe /platform:x64 "/out:$output" $source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SHAPES_TEST_JOB_HOST=$output" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify native process ownership and durable connection transport
        run: node --test --test-concurrency=1 test/owned-process.test.js test/account-revocation.test.js test/embedded-host.test.js test/embedded-startup-runtime.test.js test/windows-job.test.js test/windows-standalone-native.test.js test/windows-launch-native.test.js test/windows-owned-native.test.js test/windows-command-native.test.js test/windows-cleanup-native.test.js test/windows-command-jobs-native.test.js test/windows-native.test.js test/command-jobs.test.js test/runtime.test.js
      - name: Compile Windows computer helper and throwaway fixture
        id: computer
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $helper = Join-Path $env:RUNNER_TEMP 'shapes.inc Bridge Computer.exe'
          ./scripts/windows/build-computer.ps1 -OutputPath $helper
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          $fixture = Join-Path $env:RUNNER_TEMP 'ComputerFixture.exe'
          $source = Join-Path $PWD 'scripts\windows\ComputerFixture.cs'
          & $compiler /nologo /target:exe /platform:x64 /reference:System.Drawing.dll /reference:System.Windows.Forms.dll /reference:System.Web.Extensions.dll "/out:$fixture" $source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SHAPES_TEST_COMPUTER_HELPER=$helper" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SHAPES_TEST_COMPUTER_FIXTURE=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $medium = Join-Path $env:RUNNER_TEMP 'MediumProcess.exe'
          $source = Join-Path $PWD 'test\fixtures\windows\MediumProcess.cs'
          & $compiler /nologo /target:exe /platform:x64 "/out:$medium" $source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SHAPES_TEST_MEDIUM_PROCESS=$medium" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Exercise native Windows observe and input on owned fixture
        if: ${{ !cancelled() && steps.computer.outcome == 'success' }}
        shell: pwsh
        run: |
          $node = (Get-Command node).Source
          & $env:SHAPES_TEST_JOB_HOST --parent-pid $PID -- $env:SHAPES_TEST_MEDIUM_PROCESS -- $node --test --test-concurrency=1 test/computer.test.js test/windows-computer.test.js test/windows-computer-native.test.js
          exit $LASTEXITCODE
