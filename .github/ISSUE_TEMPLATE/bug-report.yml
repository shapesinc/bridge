name: Bug report
description: Something went wrong installing or running Bridge.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Using the shapes.inc app for Mac or Windows? Make sure it's up to date first. Please remove tokens, secrets and personal paths from anything you paste.
  - type: dropdown
    id: how
    attributes:
      label: How are you running Bridge?
      options:
        - shapes.inc Mac app
        - shapes.inc Windows app
        - Terminal install (npx … shapes-bridge install)
        - From source
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: e.g. Windows 11 23H2, macOS 15.2, Ubuntu 24.04 (Wayland)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Full output or error
      description: Paste the command output, or the result of `status` and `logs`.
      render: text
    validations:
      required: true
